<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="100%" stop-color="#141a29" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#accentGrad)" stroke-width="8" opacity="0.4" />
  <circle cx="256" cy="256" r="140" fill="url(#accentGrad)" opacity="0.15" />
  
  <!-- Headphones and sound waves -->
  <g filter="url(#glow)">
    <path d="M160 270 C160 190, 352 190, 352 270" fill="none" stroke="url(#accentGrad)" stroke-width="26" stroke-linecap="round" />
    <!-- Left ear cup -->
    <rect x="134" y="250" width="38" height="74" rx="19" fill="url(#accentGrad)" />
    <!-- Right ear cup -->
    <rect x="340" y="250" width="38" height="74" rx="19" fill="url(#accentGrad)" />
    
    <!-- Audio Waveform in Center -->
    <line x1="216" y1="290" x2="216" y2="330" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
    <line x1="236" y1="270" x2="236" y2="350" stroke="#818cf8" stroke-width="8" stroke-linecap="round" />
    <line x1="256" y1="250" x2="256" y2="370" stroke="#c084fc" stroke-width="8" stroke-linecap="round" />
    <line x1="276" y1="265" x2="276" y2="355" stroke="#818cf8" stroke-width="8" stroke-linecap="round" />
    <line x1="296" y1="285" x2="296" y2="335" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
  </g>
</svg>
